services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-api_nutriheald_socrates}
      MARIADB_USER: ${MYSQL_USER:-nutriheald}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-local_app_password}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-3307}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOSTDB: db
      USERDB: ${MYSQL_USER:-nutriheald}
      PASSWORDDB: ${MYSQL_PASSWORD:-local_app_password}
      DATABASEDB: ${MYSQL_DATABASE:-api_nutriheald_socrates}
      PORTDB: '3306'
      DATABASE_URL: mysql://${MYSQL_USER:-nutriheald}:${MYSQL_PASSWORD:-local_app_password}@db:3306/${MYSQL_DATABASE:-api_nutriheald_socrates}
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  mariadb_data:
